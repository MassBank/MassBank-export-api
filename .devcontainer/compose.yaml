name: massbank-export-api-dev

x-podman:
  in_pod: false

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    userns_mode: keep-id:uid=1000,gid=1000
    security_opt:
      - label=disable
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - maven-repo:/home/vscode/.m2:Z
      - type: bind
        source: ${XDG_RUNTIME_DIR:?Set XDG_RUNTIME_DIR to the host user runtime directory}/podman/podman.sock
        target: /run/podman/podman.sock
        bind:
          create_host_path: false
    environment:
      DB_HOST: db
      DB_USER: massbank3
      DB_PASSWORD: massbank3password
      DB_NAME: records
      MB_DATA_DIRECTORY: /workspaces/MassBank-data
      DOCKER_HOST: unix:///run/podman/podman.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.containers.internal
      TESTCONTAINERS_RYUK_DISABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    command: ["sleep", "infinity"]

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: records
      POSTGRES_USER: massbank3
      POSTGRES_PASSWORD: massbank3password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massbank3 -d records"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  maven-repo:
  # IntelliJ adds the mounts from devcontainer.json in its Compose override.
  codex-devcontainer:
    name: codex-devcontainer
  copilot-devcontainer:
    name: copilot-devcontainer
  copilot-auth-devcontainer:
    name: copilot-auth-devcontainer
