name: massbank-export-api-dev

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    userns_mode: keep-id:uid=1000,gid=1000
    security_opt:
      - label=disable
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - ..:/workspaces/MassBank-export-api:Z
      - maven-repo:/home/vscode/.m2:Z
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: massbank3
      DB_PASSWORD: massbank3password
      DB_NAME: records
      MB_DATA_DIRECTORY: /workspaces/MassBank-export-api/MassBank-data
    depends_on:
      db:
        condition: service_healthy
    command: ["sleep", "infinity"]

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: records
      POSTGRES_USER: massbank3
      POSTGRES_PASSWORD: massbank3password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massbank3 -d records"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  maven-repo:
  codex-devcontainer:
    name: codex-devcontainer
  copilot-devcontainer:
    name: copilot-devcontainer

